<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>1vs1 3D - Battleground & Lobby</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a12; color: white; }
        
        /* PANTALLA DE LOBBY */
        #lobby-screen { position: absolute; width: 100%; height: 100%; background: rgba(10,10,18,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .box { background: #161626; padding: 30px; border-radius: 12px; border: 1px solid #3b3b5e; text-align: center; width: 350px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
        button { width: 100%; padding: 10px; background: #00ffcc; color: black; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        button:hover { background: #00ccaa; }
        ul { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; text-align: left; }
        li { background: #252538; padding: 8px; margin: 5px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .invite-btn { width: auto; padding: 4px 10px; font-size: 12px; margin: 0; }

        /* INTERFAZ DEL JUEGO */
        #game-ui { display: none; position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }
        .crosshair-phantom { width: 6px; height: 6px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 8px #00ffcc; }
        .crosshair-escopeta { width: 30px; height: 30px; border: 2px solid #ff5500; border-radius: 50%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="lobby-screen">
        <div class="box" id="step-1">
            <h2>Ingresa tu Nombre</h2>
            <input type="text" id="username-input" placeholder="Tu Apodo...">
            <button onclick="conectarAlLobby()">Entrar al Lobby</button>
        </div>
        <div class="box" id="step-2" style="display:none;">
            <h2>Jugadores Disponibles</h2>
            <ul id="player-list"></ul>
        </div>
    </div>

    <div id="game-ui">
        <h3 style="margin:0 0 10px 0;">Partida 1vs1</h3>
        <p>Arma: <b id="weapon" style="color: #00ffcc;">Phantom</b></p>
        <p><span style="background:#333; padding:2px 6px; border-radius:4px;">Q</span> Cambiar Arma</p>
        <p><span style="background:#333; padding:2px 6px; border-radius:4px;">WASD</span> Moverse</p>
    </div>
    <div id="crosshair" class="crosshair-phantom"></div>

    <script>
        const socket = io(); 
        let miRoomId = null;
        let miId = null;
        let miArma = "Phantom";
        let juegoIniciado = false;

        // Variables de entorno 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // Límites físicos calculados dinámicamente desde el mapa GLB
        let mapBounds = new THREE.Box3(); 

        // --- SISTEMA DE LOBBY POR INTERFAZ ---
        function conectarAlLobby() {
            const name = document.getElementById('username-input').value;
            if(!name) return alert("Pon un nombre");
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            
            socket.emit('joinLobby', name);
            miId = socket.id;
        }

        socket.on('updateLobbyList', (users) => {
            const list = document.getElementById('player-list');
            list.innerHTML = "";
            users.forEach(user => {
                if(user.id !== socket.id) {
                    list.innerHTML += `<li>${user.name} <button class="invite-btn" onclick="invitar('${user.id}')">Retar</button></li>`;
                }
            });
            if(users.length <= 1) list.innerHTML = "<p style='color:gray;'>Esperando a que se conecte tu amigo...</p>";
        });

        function invitar(id) { socket.emit('invitePlayer', id); }

        socket.on('receiveInvite', (data) => {
            if(confirm(`¡${data.fromName} te ha desafiado a un 1vs1! ¿Aceptas?`)) {
                socket.emit('acceptInvite', data.fromId);
            }
        });

        // --- INICIAR ENTORNO 3D AL ENCONTRAR RIVAL ---
        socket.on('startGame', (data) => {
            miRoomId = data.roomId;
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.body.appendChild(renderer.domElement);
            
            // Configurar spawn según el rol asignado por el servidor
            const spawnData = data.matchData[socket.id];
            localPlayer.x = spawnData.x;
            localPlayer.z = spawnData.z;
            miArma = spawnData.weapon;
            actualizarInterfazArma();

            // Dibujar al rival en el mapa
            Object.keys(data.matchData).forEach(id => {
                if(id !== socket.id) createRemotePlayer(id, data.matchData[id]);
            });

            socket.emit('joinGameRoom', miRoomId);
            cargarMundo();
            juegoIniciado = true;
            animate();
        });

        // --- ILUMINACIÓN Y MAPA ---
        function cargarMundo() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(10, 30, 10);
            scene.add(sun);

            const loader = new THREE.GLTFLoader();
            loader.load('./1v1camp.glb', (gltf) => {
                const map = gltf.scene;
                map.scale.set(10, 10, 10); // Escala del mapa base
                map.position.set(0, 0, 0);
                map.traverse(c => { if(c.isMesh) { c.receiveShadow = true; c.castShadow = true; } });
                scene.add(map);

                // IMPORTANTE: Calcula los límites tridimensionales exactos de tu mapa GLB automáticamente
                mapBounds.setFromObject(map);
            });
        }

        // --- CONFIGURACIÓN MINIATURA DEL JUGADOR LOCAL (Escala Humana Real) ---
        // Reducimos radicalmente la altura a un valor bajo (y = 0.4) para simular que eres pequeño dentro del mapa gigante
        const localPlayer = { x: 0, y: 0.4, z: 0 }; 
        const remotePlayers = {};

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { 
            if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'q') {
                miArma = (miArma === 'Phantom') ? 'Escopeta' : 'Phantom';
                actualizarInterfazArma();
                socket.emit('changeWeapon', { roomId: miRoomId, weapon: miArma });
            }
        });
        window.addEventListener('keyup', (e) => { if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = false; });

        function actualizarInterfazArma() {
            const txt = document.getElementById('weapon');
            const cross = document.getElementById('crosshair');
            txt.innerText = miArma;
            if(miArma === 'Phantom') { txt.style.color = "#00ffcc"; cross.className = "crosshair-phantom"; }
            else { txt.style.color = "#ff5500"; cross.className = "crosshair-escopeta"; }
        }

        window.addEventListener('click', () => { if(juegoIniciado) socket.emit('shoot', { roomId: miRoomId, weapon: miArma }); });

        // --- MANEJO DE RED EN TIEMPO REAL ---
        socket.on('playerMoved', (data) => {
            if (remotePlayers[data.id]) remotePlayers[data.id].position.set(data.x, 0.4, data.z);
        });

        socket.on('enemyChangedWeapon', (data) => {
            if (remotePlayers[data.id]) remotePlayers[data.id].material.color.setHex(data.weapon === 'Phantom' ? 0x00ffcc : 0xff5500);
        });

        socket.on('enemyShot', (data) => { alert(`¡Te dispararon con ${data.weapon}!`); });

        socket.on('playerDisconnected', (id) => {
            if (remotePlayers[id]) { scene.remove(remotePlayers[id]); delete remotePlayers[id]; }
            alert("Tu rival abandonó la partida. Recarga para volver al lobby.");
        });

        function createRemotePlayer(id, data) {
            // Personaje del enemigo creado proporcionalmente muy pequeño (Cápsula miniatura)
            const geometry = new THREE.CapsuleGeometry(0.15, 0.4, 4, 8); 
            const material = new THREE.MeshStandardMaterial({ color: data.weapon === 'Phantom' ? 0x00ffcc : 0xff5500 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.x, 0.4, data.z);
            scene.add(mesh);
            remotePlayers[id] = mesh;
        }

        // --- BUCLE FÍSICO CON LIMITADORES DE MOVIMIENTO ---
        function animate() {
            if(!juegoIniciado) return;
            requestAnimationFrame(animate);

            let moved = false;
            const speed = 0.08; // Velocidad reducida ideal para personajes pequeños

            // Guardamos la posición antes de movernos para restaurarla en caso de chocar los límites
            let viejoX = localPlayer.x;
            let viejoZ = localPlayer.z;

            if (keys.w) { localPlayer.z -= speed; moved = true; }
            if (keys.s) { localPlayer.z += speed; moved = true; }
            if (keys.a) { localPlayer.x -= speed; moved = true; }
            if (keys.d) { localPlayer.x += speed; moved = true; }

            // FÍSICA DE BORDES: Si el mapa ya cargó, comprobamos que el jugador no se salga de la caja sólida del .glb
            if (!mapBounds.isEmpty()) {
                // Margen de seguridad para no traspasar paredes exteriores
                const padding = 0.5; 
                if (localPlayer.x < mapBounds.min.x + padding || localPlayer.x > mapBounds.max.x - padding) {
                    localPlayer.x = viejoX; // Bloquea movimiento en X
                }
                if (localPlayer.z < mapBounds.min.z + padding || localPlayer.z > mapBounds.max.z - padding) {
                    localPlayer.z = viejoZ; // Bloquea movimiento en Z
                }
            }

            // Colocamos la cámara pegada a la escala minúscula del jugador
            camera.position.set(localPlayer.x, localPlayer.y + 0.5, localPlayer.z + 1.8);
            camera.lookAt(localPlayer.x, localPlayer.y, localPlayer.z - 2);

            if (moved) {
                socket.emit('playerMovement', { roomId: miRoomId, x: localPlayer.x, z: localPlayer.z });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
