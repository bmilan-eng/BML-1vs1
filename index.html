<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>1vs1 3D: Phantom vs Escopeta</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="ui">
        <p>Arma: <span id="weapon">Cargando...</span></p>
        <p>Controles: WASD para moverte. Clic para disparar.</p>
    </div>
    <div id="crosshair"></div>

    <script>
        // Cambia esta URL por la de tu servidor backend cuando lo despliegues
        const socket = io(); 

        // Configuración Básica de Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luz
        const light = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Suelo / Arena
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Gestión de jugadores
        const localPlayer = { x: Math.random() * 10 - 5, z: Math.random() * 10 - 5, rotation: 0 };
        const remotePlayers = {};
        let miArma = "";

        // Teclado
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = false; });

        // Disparar
        window.addEventListener('click', () => {
            socket.emit('shoot', { weapon: miArma });
            console.log("Disparaste con: " + miArma);
        });

        // Lógica de Red (Sockets)
        socket.on('currentPlayers', (players) => {
            miArma = players[socket.id].weapon;
            document.getElementById('weapon').innerText = miArma;
            
            Object.keys(players).forEach((id) => {
                if (id !== socket.id) {
                    createRemotePlayer(id, players[id]);
                }
            });
        });

        socket.on('newPlayer', (data) => {
            createRemotePlayer(data.id, data.player);
        });

        socket.on('playerMoved', (data) => {
            if (remotePlayers[data.id]) {
                remotePlayers[data.id].position.set(data.player.x, 1, data.player.z);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id]);
                delete remotePlayers[id];
            }
        });

        socket.on('enemyShot', (data) => {
            alert(`¡El enemigo te disparó con una ${data.weapon}!`);
        });

        function createRemotePlayer(id, playerData) {
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            // Color según el arma para diferenciarlos
            const color = playerData.weapon === 'Phantom' ? 0x0000ff : 0xffaa00; 
            const material = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(playerData.x, 1, playerData.z);
            scene.add(mesh);
            remotePlayers[id] = mesh;
        }

        // Bucle de Animación / Actualización
        function animate() {
            requestAnimationFrame(animate);

            // Movimiento Local
            let moved = false;
            const speed = 0.1;
            if (keys.w) { localPlayer.z -= speed; moved = true; }
            if (keys.s) { localPlayer.z += speed; moved = true; }
            if (keys.a) { localPlayer.x -= speed; moved = true; }
            if (keys.d) { localPlayer.x += speed; moved = true; }

            // Actualizar cámara pegada al jugador local
            camera.position.set(localPlayer.x, 2, localPlayer.z + 5);
            camera.lookAt(localPlayer.x, 1, localPlayer.z - 5);

            if (moved) {
                socket.emit('playerMovement', { x: localPlayer.x, z: localPlayer.z, rotation: localPlayer.rotation });
            }

            renderer.render(scene, camera);
        }

        animate();

        // Ajuste de pantalla
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
