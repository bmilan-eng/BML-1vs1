<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>1vs1 3D - Pro Battleground</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a12; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .crosshair-phantom { width: 6px; height: 6px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 8px #00ffcc; }
        .crosshair-escopeta { width: 30px; height: 30px; border: 2px solid #ff5500; border-radius: 50%; box-shadow: inset 0 0 5px #ff5500; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="ui">
        <h2>Sala 1vs1</h2>
        <p>Arma actual: <b id="weapon" style="color: #00ffcc;">Phantom</b></p>
        <p><span style="background:#333; padding:2px 6px; border-radius:4px;">Q</span> Cambiar Arma</p>
        <p><span style="background:#333; padding:2px 6px; border-radius:4px;">WASD</span> Moverse</p>
        <p id="map-status" style="color: #00ff00;">¡Mapa cargado!</p>
    </div>
    <div id="crosshair" class="crosshair-phantom"></div>

    <script>
        const socket = io(); 

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeebb, 1.5);
        sunLight.position.set(10, 50, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- CARGA Y AJUSTE DEL ESCENARIO ---
        const loader = new THREE.GLTFLoader();
        loader.load('./1v1camp.glb', (gltf) => {
            const map = gltf.scene;
            
            // CAMBIO CLAVE 1: Agrandamos el mapa x15 veces para que tenga tamaño real de arena
            map.scale.set(15, 15, 15); 
            
            // Centramos el mapa en el origen (0,0,0)
            map.position.set(0, 0, 0);

            map.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                    child.castShadow = true;
                }
            });
            scene.add(map);
        });

        // CAMBIO CLAVE 2: Posición inicial del jugador (en el suelo del mapa)
        const localPlayer = { x: 0, y: 1.5, z: 5 }; 
        const remotePlayers = {};
        let miId = null;
        let miArma = "Phantom";

        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { 
            if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'q') {
                miArma = (miArma === 'Phantom') ? 'Escopeta' : 'Phantom';
                actualizarInterfazArma();
                socket.emit('changeWeapon', miArma);
            }
        });
        window.addEventListener('keyup', (e) => { if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = false; });

        function actualizarInterfazArma() {
            const txt = document.getElementById('weapon');
            const cross = document.getElementById('crosshair');
            txt.innerText = miArma;
            if(miArma === 'Phantom') {
                txt.style.color = "#00ffcc";
                cross.className = "crosshair-phantom";
            } else {
                txt.style.color = "#ff5500";
                cross.className = "crosshair-escopeta";
            }
        }

        window.addEventListener('click', () => { socket.emit('shoot'); });

        socket.on('initGame', (data) => {
            miId = data.id;
            miArma = data.allPlayers[miId].weapon;
            actualizarInterfazArma();

            Object.keys(data.allPlayers).forEach((id) => {
                if (id !== miId && data.allPlayers[id].room === data.allPlayers[miId].room) {
                    createRemotePlayer(id, data.allPlayers[id]);
                }
            });
        });

        socket.on('newPlayer', (data) => { createRemotePlayer(data.id, data.player); });

        socket.on('playerMoved', (data) => {
            if (remotePlayers[data.id]) {
                // Multiplicamos la posición del rival por la escala del mapa
                remotePlayers[data.id].position.set(data.player.x, 1.5, data.player.z);
            }
        });

        socket.on('enemyChangedWeapon', (data) => {
            if (remotePlayers[data.id]) {
                remotePlayers[data.id].material.color.setHex(data.weapon === 'Phantom' ? 0x00ffcc : 0xff5500);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id]);
                delete remotePlayers[id];
            }
        });

        function createRemotePlayer(id, playerData) {
            if(remotePlayers[id]) return;
            // Agrandamos también el tamaño visual del enemigo para que concuerde
            const geometry = new THREE.CapsuleGeometry(0.6, 1.8, 4, 8);
            const color = playerData.weapon === 'Phantom' ? 0x00ffcc : 0xff5500;
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(playerData.x, 1.5, playerData.z);
            mesh.castShadow = true;
            scene.add(mesh);
            remotePlayers[id] = mesh;
        }

        // --- MOVIMIENTO EN PRIMERA/TERCERA PERSONA DENTRO DEL MAPA ---
        function animate() {
            requestAnimationFrame(animate);
            let moved = false;
            
            // Velocidad ajustada al nuevo tamaño del mapa
            const speed = 0.25; 
            if (keys.w) { localPlayer.z -= speed; moved = true; }
            if (keys.s) { localPlayer.z += speed; moved = true; }
            if (keys.a) { localPlayer.x -= speed; moved = true; }
            if (keys.d) { localPlayer.x += speed; moved = true; }

            // Colocamos la cámara justo detrás de la cabeza de nuestra posición real
            camera.position.set(localPlayer.x, localPlayer.y + 1, localPlayer.z + 6);
            camera.lookAt(localPlayer.x, localPlayer.y, localPlayer.z - 5);

            if (moved && miId) {
                socket.emit('playerMovement', { x: localPlayer.x, z: localPlayer.z, rotation: 0 });
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
